name: ci
on:
    pull_request:
    push:
        branches:
            [main]
permissions: 
    contents: read
jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: Set up Python 3.12
              uses: actions/setup-python@v7
              with:
                  python-version: "3.12"
            - name: Run tests
              run: python -m unittest -v